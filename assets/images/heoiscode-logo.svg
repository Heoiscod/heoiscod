<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="200" fill="none"/>

  <g stroke="#0047FF" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M 40 55 L 18 100 L 40 145"/>
    <path d="M 92 55 L 114 100 L 92 145"/>
  </g>

  <text x="132" y="124" class="wordmark" fill="#00B8FF" opacity="0.55" transform="translate(-3,-2)">heo<tspan fill="#0A0E1A">iscode</tspan></text>
  <text x="132" y="124" class="wordmark" fill="#FF2D55" opacity="0.4" transform="translate(3,2)">heo<tspan fill="#0A0E1A">iscode</tspan></text>

  <text x="132" y="124" class="wordmark" fill="#0A0E1A">heo<tspan fill="#0047FF">iscode</tspan></text>

  <rect x="474" y="70" width="14" height="56" fill="#0047FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="40" y="152" width="448" height="4" fill="#0047FF"/>
  <text x="40" y="180" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="3" fill="#4B5A70">DEV &#183; DEBUG &#183; DEPLOY</text>
