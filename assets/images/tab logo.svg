<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="64" height="64" fill="#0A0E1A"/>

  <!-- glitch echoes -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="800" font-size="34">
    <text x="10" y="43" fill="#FF2D55" opacity="0.5" transform="translate(-1.5,-1)">h</text>
    <text x="10" y="43" fill="#00B8FF" opacity="0.5" transform="translate(1.5,1)">h</text>
    <text x="10" y="43" fill="#ffffff">h</text>
  </g>

  <!-- code brackets -->
  <g stroke="#0047FF" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M 44 20 L 52 32 L 44 44"/>
  </g>

  <!-- cursor -->
  <rect x="55" y="22" width="4" height="20" fill="#0047FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="8" y="50" width="48" height="3" fill="#0047FF"/>
</svg>
