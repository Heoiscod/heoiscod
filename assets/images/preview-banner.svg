    <circle cx="132" cy="470" r="2" fill="#7DD3FC"/>
    <circle cx="1088" cy="258" r="2" fill="#7DD3FC"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="240" y="212" width="720" height="4" rx="2" fill="#4CC9FF"/>
    <rect x="240" y="415" width="720" height="4" rx="2" fill="#4CC9FF"/>
  </g>

  <g>
