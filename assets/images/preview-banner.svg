    <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="0.8" fill="#1E6EF2" opacity="0.65" transform="translate(7 0)">&lt;HeoIsCod&gt;</text>
    <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="0.8" fill="#0DB7FF" opacity="0.9" transform="translate(-7 0)" filter="url(#blueBlur)">&lt;HeoIsCod&gt;</text>
  </g>

  <g>
