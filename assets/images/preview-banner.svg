<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="197" y1="138" x2="1006" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF5FF"/>
      <stop offset="0.3" stop-color="#B6D9FF"/>
      <stop offset="0.7" stop-color="#37A5FF"/>
      <stop offset="1" stop-color="#0D6BFF"/>
    </linearGradient>
    <filter id="blueBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.18">
